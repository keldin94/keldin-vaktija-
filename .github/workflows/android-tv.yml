name: Nur Vaktija — Android TV APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build preview APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Save preview APK (GitHub Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Nur-Vaktija-Preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Ensure production signing secrets are configured
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_B64: ${{ secrets.VAKTIJA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.VAKTIJA_STORE_PASSWORD }}
          ALIAS: ${{ secrets.VAKTIJA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VAKTIJA_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_B64" && test -n "$STORE_PASS" && test -n "$ALIAS" && test -n "$KEY_PASS" || (echo "Missing Android signing secrets. See README." && exit 1)
          printf '%s' "$SIGNING_B64" | base64 -d > "$RUNNER_TEMP/nur-vaktija.jks"
      - name: Build permanently signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VAKTIJA_SIGNING_STORE: ${{ runner.temp }}/nur-vaktija.jks
          VAKTIJA_STORE_PASSWORD: ${{ secrets.VAKTIJA_STORE_PASSWORD }}
          VAKTIJA_KEY_ALIAS: ${{ secrets.VAKTIJA_KEY_ALIAS }}
          VAKTIJA_KEY_PASSWORD: ${{ secrets.VAKTIJA_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk Nur-Vaktija.apk
      - name: Publish direct Downloader-friendly GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nur-Vaktija.apk
          generate_release_notes: true
